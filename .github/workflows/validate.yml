name: Validate NETSO OS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate required production files
        run: |
          test -f package.json
          test -f app/layout.tsx
          test -f app/page.tsx
          test -f lib/supabase.ts
          test -f supabase/schema.sql
          test -f vercel.json

      - name: Check for committed service-role credentials
        run: |
          ! git grep -nE 'SUPABASE_SERVICE_ROLE_KEY|service_role' -- ':!tests/architecture.test.js' ':!*.md' ':!.github/workflows/validate.yml'

      - name: Typecheck
        run: npm run typecheck

      - name: Run architecture tests
        run: npm test

      - name: Production build
        run: npm run build
